openapi: 3.1.0
info:
  title: Container GUI SSH Quick Configuration API
  version: 2.6.0
  description: Structured SSH preset for new containers and authoritative loopback readiness status.
servers:
  - url: http://127.0.0.1:8787/api/v1
security: []

paths:
  /containers:
    post:
      operationId: createContainer
      summary: Create a container with an optional key-only SSH preset
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerCreateRequest"
      responses:
        "202":
          description: Operation accepted
          content:
            application/json:
              schema:
                type: object
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"

  /containers/{containerId}/ssh:
    get:
      operationId: getContainerSSHStatus
      summary: Read SSH configuration and loopback protocol readiness for one current container
      parameters:
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Current derived SSH status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerSSHStatus"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ProblemResponse:
      description: Stable structured error
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code, message, retryable, diagnosticId]

  schemas:
    PortMapping:
      type: object
      additionalProperties: false
      required: [hostPort, containerPort]
      properties:
        hostPort:
          type: integer
          minimum: 1024
          maximum: 65535
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
          default: tcp

    EnvironmentEntry:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        value:
          type: string
          maxLength: 4096
          writeOnly: true

    SSHCreateConfiguration:
      type: object
      additionalProperties: false
      required: [hostPort, username, publicKey]
      properties:
        hostPort:
          type: integer
          minimum: 1024
          maximum: 65535
          default: 2222
        username:
          type: string
          pattern: "^(?!root$)[a-z_][a-z0-9_-]{0,31}$"
          default: dev
        publicKey:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true

    ContainerCreateRequest:
      type: object
      additionalProperties: false
      required: [name, image]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        image:
          type: string
          minLength: 1
          maxLength: 512
        cpus:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1024
        memoryMiB:
          type: [integer, "null"]
          minimum: 1
          maximum: 1048576
        ports:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/PortMapping"
        environment:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/EnvironmentEntry"
        arguments:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 4096
        startAfterCreate:
          type: boolean
          default: false
        ssh:
          oneOf:
            - $ref: "#/components/schemas/SSHCreateConfiguration"
            - type: "null"

    ContainerSSHConnection:
      type: object
      additionalProperties: false
      required: [host, hostPort, username, connectionCommand]
      properties:
        host:
          type: string
          const: 127.0.0.1
        hostPort:
          type: integer
          minimum: 1024
          maximum: 65535
        username:
          type: string
        connectionCommand:
          type: string

    ContainerSSHStatus:
      type: object
      additionalProperties: false
      required: [containerId, state, observedAt]
      properties:
        containerId:
          type: string
        state:
          type: string
          enum: [notConfigured, stopped, initializing, ready, failed]
        connection:
          oneOf:
            - $ref: "#/components/schemas/ContainerSSHConnection"
            - type: "null"
        observedAt:
          type: string
          format: date-time
